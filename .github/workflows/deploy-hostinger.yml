name: Deploy Hostinger Live

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 76.13.150.125
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            if [ ! -d /opt/krpito-app/.git ]; then
              git clone https://github.com/cumhursak53-del/Mobil-Tarama-Kripto.git /opt/krpito-app
            fi
            cd /opt/krpito-app
            git pull --ff-only origin main
            grep -q SIGNAL_LOG_RESET_HOUR /opt/krpito/live.env || echo 'SIGNAL_LOG_RESET_HOUR=3' >> /opt/krpito/live.env
            grep -q SIGNAL_WATCH_HOURS /opt/krpito/live.env || echo 'SIGNAL_WATCH_HOURS=24' >> /opt/krpito/live.env
            cp /opt/krpito/live.env live.env
            bash scripts/deploy_vps.sh
            systemctl is-active krpito-live
            journalctl -u krpito-live -n 8 --no-pager
