name: Sync Render env

on:
  push:
    branches: [main]
    paths:
      - render.env
      - scripts/sync_render_env.py
      - .github/workflows/sync-render-env.yml
  workflow_dispatch:

concurrency:
  group: sync-render-env
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render API ile env senkron (opsiyonel)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::notice::RENDER_API_KEY secret yok — atlandi."
            echo "render.env deploy ile otomatik yuklenir (engine/env_loader.py). Secret opsiyoneldir."
            exit 0
          fi
          python scripts/sync_render_env.py --deploy

      - name: render.env dogrulama
        run: |
          test -f render.env
          grep -q "WEB_RESEARCH_ENABLED=1" render.env
          grep -q "ENTRY_MODE_DEFAULT=live" render.env
          echo "render.env OK — bir sonraki Render deploy'da uygulanacak."
