# Crew artik Render worker uzerinde calisir (CREW_AUTO=1).
# Manuel tetikleme icin workflow_dispatch — mail kapali.
name: Crew Daily Strategy Report

on:
  workflow_dispatch:

jobs:
  crew-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Crew daily pipeline (no email)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CREW_SEND_EMAIL: "0"
        run: python -m engine.crew.daily

      - name: Upload crew state artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crew-state-${{ github.run_id }}
          path: crew_state.json
          retention-days: 30
